        color: #cbd5e1;

    }

        color: #94a3b8;
        text-align: center;
    }

    .input-group {

    }

    label {

        color: var(--text-light);
    }

    input, select {

        padding: 0.6rem;
        border: 1px solid var(--primary) !important;
        border-radius: 0.375rem;
        background: rgba(22, 33, 62, 0.8) !important;
        color: var(--text-light) !important;
        margin-bottom: 0.5rem;
        transition: all 0.3s ease !important;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #21bf73 !important;
        box-shadow: 0 0 15px rgba(107, 70, 193, 0.4) !important;
    }

    .toggle-group {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
        padding: 0.75rem;
        background-color: var(--bg-darker);
        border: 1px solid var(--primary);
        border-radius: 0.375rem;
        box-shadow: inset 0 0 10px rgba(107, 70, 193, 0.2);
    }

    .mode-group {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
    }

    .mode-button {
        flex: 1;
        padding: 0.6rem;
        border: 2px solid var(--primary) !important;
        border-radius: 0.375rem;
        background-color: transparent;
        color: var(--text-light);
        cursor: pointer;
        transition: all 0.2s;
        clip-path: polygon(90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%, 10% 0);
    }

    .mode-button.active {
        background-color: var(--primary);
        border-color: var(--primary);
    }

    .mode-button:hover {
        background-color: var(--primary-hover);
    }

    button {
        width: 100%;
        padding: 0.8rem;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
        font-size: 1.0rem;
        transition: all 0.3s ease;
        margin-bottom: 0.5rem;
        position: relative;
        overflow: hidden;
        border: 2px solid var(--primary) !important;
        clip-path: polygon(95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%, 5% 0);
    }

    button:hover {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(107, 70, 193, 0.4);
    }

    button::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(107, 70, 193, 0.2), transparent);
        transform: rotate(45deg);
        transition: all 0.5s;
    }

    button:hover::before {
        animation: cyber-glow 1.5s infinite;
    }

    .oraclize-btn {
        background-color: #21bf73;
    }

    #result {
        margin-top: 1.5rem;
        padding: 1rem;
        background: rgba(22, 33, 62, 0.8);
        border-radius: 0.375rem;
        border: 1px solid var(--primary);
        box-shadow: inset 0 0 20px rgba(107, 70, 193, 0.1),

        position: relative;

    #result strong {
        color: #a78bfa;
    }

    #changingLines {

        margin-top: 1rem;
        padding: 1rem;

        border: 1px solid var(--primary);
        box-shadow: inset 0 0 20px rgba(107, 70, 193, 0.1);

        align-items: center;

        font-family: 'Orbitron', sans-serif;

        background: rgba(22, 33, 62, 0.9) !important;
    }

    .add-fate {
        background-color: #21bf73 !important;
        width: auto !important;
        padding: 0.5rem 1rem !important;
    }

                .checkbox-wrapper {

        .step-down-toggle {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.3s, border-color 0.3s;

        .step-down-toggle:checked {
            background-color: #39FF14;
            border-color: #39FF14;
        }

            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: translate(-50%, -50%) rotate(45deg);

                        <div class="input-group">

function initializeFatePoints() {
    const storedData = localStorage.getItem(FATE_STORAGE_KEY);
    const now = Date.now();

    if (storedData) {
        const { points, timestamp } = JSON.parse(storedData);
        const hoursSince = (now - timestamp) / (1000 * 60 * 60);

        if (hoursSince >= 24) {
            const newPoints = Math.min(points + BASE_FATE_POINTS, MAX_FATE_POINTS);
            document.getElementById('fatePoints').value = newPoints;
            updateFateStorage(newPoints);
        } else {
            document.getElementById('fatePoints').value = Math.min(points, MAX_FATE_POINTS);
        }
    } else {
        document.getElementById('fatePoints').value = BASE_FATE_POINTS;
        updateFateStorage(BASE_FATE_POINTS);
    }
}

let shakeEnabled = false;
let isShaking = false;
let shakeStartTime = 0;
let lastShakeTime = 0; // Add this if not already present
let inactivityTimer;
let shouldClearOnNextRoll = false;

// Shake Configuration
const MIN_SHAKE_DURATION = 2000;
const SHAKE_END_TIMEOUT = 500;
const SHAKE_THRESHOLD = 15;
const SHAKE_COOLDOWN = 1000;

// Modified handleShake function
function handleShake(event) {
    if (!shakeEnabled) return;

    const now = Date.now();
    const acceleration = event.accelerationIncludingGravity;
    const magnitude = Math.sqrt(
        acceleration.x ** 2 +
        acceleration.y ** 2 +
        acceleration.z ** 2
    );

    // Check if we're above the shake threshold
    if (magnitude > SHAKE_THRESHOLD) {
        // Start tracking shake duration if not already shaking
        if (!isShaking) {
            isShaking = true;
            shakeStartTime = now;
            document.getElementById('shakeStatus').textContent = "Shaking detected...";
            
            // Initial vibration feedback
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        }

        // Reset the cooldown timer
        lastShakeTime = now;
    }

    // Check if shaking has stopped
    if (isShaking && now - lastShakeTime > SHAKE_END_TIMEOUT) {
        const shakeDuration = now - shakeStartTime;

        if (shakeDuration >= MIN_SHAKE_DURATION) {
            // Successful shake
            if (shouldClearOnNextRoll) {
                resetFormFields();
            }

            rollDiceAndHexagram();

            // Success vibration feedback
            if (navigator.vibrate) {
                navigator.vibrate([200, 50, 100]);
            }

            document.getElementById('shakeStatus').textContent = "Roll completed!";
            shouldClearOnNextRoll = true;
        } else {
            // Insufficient shake duration
            document.getElementById('shakeStatus').textContent = "Shake harder! (2+ seconds)";

            // Feedback for insufficient shake
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        }

        // Reset shake state
        isShaking = false;
        shakeStartTime = 0;
    }
}

// Modified enableShakeDetection function
function enableShakeDetection() {
    if (typeof DeviceMotionEvent !== 'undefined') {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            // iOS 13+ devices
            DeviceMotionEvent.requestPermission()
                .then(permission => {
                    if (permission === 'granted') {
                        window.addEventListener('devicemotion', handleShake);
                        shakeEnabled = true;
                        document.getElementById('shakeStatus').textContent = 'Shake detection enabled!';
                    } else {
                        document.getElementById('shakeStatus').textContent = 'Shake permission denied';
                    }
                })
                .catch(error => {
                    console.error('Error requesting motion permission:', error);
                    document.getElementById('shakeStatus').textContent = 'Error enabling shake detection';
                });
        } else {
            // Non-iOS devices
            window.addEventListener('devicemotion', handleShake);
            shakeEnabled = true;
            document.getElementById('shakeStatus').textContent = 'Shake to roll!';
        }
    } else {
        document.getElementById('shakeStatus').textContent = 'Device motion not supported';
    }
}

        alert('How to Play:\n\n1. Set DC\n2. Choose die type\n3. Add modifiers\n4. Toggle Step Down\n5. Select mode\n6. Shake or press Harmonize!\n7. Use Oraclize (costs 1 Fate Point) to reveal changing lines');
    });

    document.querySelector('button[onclick="rollDiceAndHexagram()"]').addEventListener('click', () => {
        if (shouldClearOnNextRoll) {
            resetFormFields();
        }
    });
}

// Initialize App
initializeFatePoints();
setupActivityListeners();
startInactivityTimer();
document.getElementById('dieType').value = '6';

// Add shake status element if not already in HTML
if (!document.getElementById('shakeStatus')) {
    const status = document.createElement('div');
    status.id = 'shakeStatus';
    status.style.margin = '1rem 0';
    status.style.textAlign = 'center';
    document.querySelector('main').prepend(status);
}
