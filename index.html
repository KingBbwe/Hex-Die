        // Core Functions
        function initializeFatePoints() {
            const storedData = localStorage.getItem(FATE_STORAGE_KEY);
            const now = Date.now();
            
            if (storedData) {
                const { points, timestamp } = JSON.parse(storedData);
                const hoursSince = (now - timestamp) / (1000 * 60 * 60);
                
                if (hoursSince >= 24) {
                    const newPoints = Math.min(points + BASE_FATE_POINTS, MAX_FATE_POINTS);
                    document.getElementById('fatePoints').value = newPoints;
                    updateFateStorage(newPoints);
                } else {
                    document.getElementById('fatePoints').value = Math.min(points, MAX_FATE_POINTS);
                }
            } else {
                document.getElementById('fatePoints').value = BASE_FATE_POINTS;
                updateFateStorage(BASE_FATE_POINTS);
            }
        }

        function updateFateStorage(points) {
            const storageData = {
                points: points || parseInt(document.getElementById('fatePoints').value),
                timestamp: Date.now()
            };
            localStorage.setItem(FATE_STORAGE_KEY, JSON.stringify(storageData));
        }

        function addFatePoint() {
            const current = parseInt(document.getElementById('fatePoints').value);
            if (current < MAX_FATE_POINTS) {
                const newValue = current + 1;
                document.getElementById('fatePoints').value = newValue;
                updateFateStorage(newValue);
            }
            startInactivityTimer();
        }

        function resetFormFields() {
            document.getElementById('dc').value = '';
            document.getElementById('modifier').value = '0';
            document.getElementById('stepDownToggle').checked = false;
            document.getElementById('changingLines').style.display = 'none';
            document.getElementById('changingLines').innerHTML = '';
        }

        function startInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                resetFormFields();
                document.getElementById('result').innerHTML = '';
            }, INACTIVITY_TIMEOUT);
        }

                case 'roll':
                    telegramMessage = 
                        `✨ *Hexagram Cast & Roll* ✨\n` +
                        `▫️▫️▫️▫️▫️▫️▫️▫️▫️\n` +
                        `🌌 *Hexagram*: ${data.originalHexagram}\n` +
                        `🎲 *Die*: d${data.dieType} → ${data.dieRoll}\n` +
                        (data.stepDownUsed ? `⚡ *Step Down Applied*: -${data.hexagramReduction}\n` : '') +
                        `📊 *Total*: ${data.total} (DC: ${data.dc})\n` +
                        `📜 *Outcome*: ${data.outcome}\n` +
                        `🔮 ${data.narrative.substring(0, 100)}...\n` +
                        `▫️▫️▫️▫️▫️▫️▫️▫️▫️\n` +
                        `#AuldEwe #FateCast`;
                    break;
            }

            try {
                const response = await fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: telegramMessage,
                        parse_mode: 'Markdown'
                    })
                });
                if (!response.ok) console.error('Telegram API error:', await response.text());
            } catch (error) {
                console.error('Error sending to Telegram:', error);
            }
        }

        function getActiveNarratives() {
            if (document.getElementById('personalMode').classList.contains('active')) return personalNarratives;
            if (document.getElementById('actionMode').classList.contains('active')) return actionNarratives;
            return generalNarratives;
        }

        function generateHexagramLines(hexagramNumber) {
            const binary = hexagramLookup[hexagramNumber];
            return binary.split('').map(b => b === '1' ? 'Solid' : 'Broken');
        }

        function determineChangingLines() {
            return Array.from({ length: 6 }, (_, i) => 
                Math.random() < 0.25 ? i + 1 : null
            ).filter(Boolean);
        }

        function applyLineChanges(lines) {
            lines.forEach(line => {
                const idx = line - 1;
                currentHexagramLines[idx] = currentHexagramLines[idx] === 'Solid' ? 'Broken' : 'Solid';
            });
        }

        function getOutcome(dieRoll, dieType) {
            const thresholds = outcomeThresholds[dieType] || { triumph: [], conflict: [], disaster: [] };
            if (thresholds.triumph.includes(dieRoll)) return 'Triumph';
            if (thresholds.conflict.includes(dieRoll)) return 'Conflict';
            return 'Disaster';
        }

        function applyStepDown(currentDie) {
            const [newDie, reduction] = stepDownConfig[currentDie] || [currentDie, 0];
            return { newDieType: newDie, hexagramReduction: reduction };
        }

        function rollDiceAndHexagram() {
            const stepDownUsed = document.getElementById('stepDownToggle').checked;
            const dc = parseInt(document.getElementById('dc').value) || 0;
            let dieType = parseInt(document.getElementById('dieType').value);
            const mod = parseInt(document.getElementById('modifier').value) || 0;

            const { newDieType, hexagramReduction } = stepDownUsed ? applyStepDown(dieType) : { newDieType: dieType, hexagramReduction: 0 };
            dieType = newDieType;

            currentHexagramNumber = Math.floor(Math.random() * 64) + 1;
            currentHexagramLines = generateHexagramLines(currentHexagramNumber);
            const adjustedHex = Math.max(1, currentHexagramNumber - hexagramReduction);

            const dieRoll = Math.floor(Math.random() * dieType) + 1;
            const outcome = getOutcome(dieRoll, dieType);
            const total = adjustedHex + dieRoll + mod;

            currentChangingLines = determineChangingLines();
            applyLineChanges(currentChangingLines);

            const activeNarratives = getActiveNarratives();
            const narrative = activeNarratives[currentHexagramNumber]?.[outcome.toLowerCase()] || 'No narrative available';

            document.getElementById('result').innerHTML = `
                <strong>Mode:</strong> ${document.querySelector('.mode-button.active').textContent}<br>
                <strong>Original Hexagram:</strong> ${currentHexagramNumber}<br>
                <strong>Adjusted Hexagram:</strong> ${adjustedHex} ${hexagramReduction ? `(-${hexagramReduction})` : ''}<br>
                <strong>Die Roll:</strong> d${dieType} → ${dieRoll}<br>
                <strong>Modifier:</strong> ${mod}<br>
                <strong>Total:</strong> ${total} vs DC ${dc}<br>
                <strong>Outcome:</strong> ${outcome}<br>
                <strong>Narrative:</strong> ${narrative}
            `;

            sendToTelegram('roll', {
                originalHexagram: currentHexagramNumber,
                dieType: dieType,
                dieRoll: dieRoll,
                total: total,
                dc: dc,
                outcome: outcome,
                narrative: narrative,
                stepDownUsed: stepDownUsed,
                hexagramReduction: hexagramReduction
            });

            startInactivityTimer();
        }

        function showChangingLines() {
            const fatePoints = parseInt(document.getElementById('fatePoints').value);
            if (fatePoints < 1) {
                alert("Not enough Fate Points!");
                return;
            }

            if (confirm("This action costs 1 Fate Point\nProceed?")) {
                document.getElementById('fatePoints').value = fatePoints - 1;
                document.getElementById('changingLines').style.display = 'block';
                document.getElementById('changingLines').innerHTML = `
                    <strong>Changing Lines:</strong> ${currentChangingLines.join(', ')}
                `;
                updateFateStorage();
                startInactivityTimer();
            }
        }

        function enableShakeDetection() {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') initShakeDetection();
                        else updateShakeStatus('Permission denied for motion detection');
                    })
                    .catch(console.error);
            } else {
                initShakeDetection();
            }
        }

        function initShakeDetection() {
            shakeEnabled = true;
            updateShakeStatus('Shake detection enabled! Shake your device to roll.');
            window.addEventListener('devicemotion', handleShake);
        }

        function updateShakeStatus(message) {
            document.getElementById('shakeStatus').textContent = message;
        }

        function handleShake(event) {
            if (!shakeEnabled) return;
            const now = Date.now();
            if (now - lastShake < shakeCooldown) return;

            const acceleration = event.accelerationIncludingGravity;
            const magnitude = Math.sqrt(acceleration.x**2 + acceleration.y**2 + acceleration.z**2);

            if (magnitude > shakeThreshold) {
                lastShake = now;
                resetFormFields();
                rollDiceAndHexagram();
            }
        }

        function setupActivityListeners() {
            const inputs = ['dc', 'modifier', 'stepDownToggle', 'dieType'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', startInactivityTimer);
            });

            const buttons = ['enableMotion', 'personalMode', 'generalMode', 'actionMode', 'howToPlayBtn'];
            buttons.forEach(id => {
                document.getElementById(id).addEventListener('click', startInactivityTimer);
            });
        }

        document.querySelectorAll('.mode-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.mode-button').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                startInactivityTimer();
            });
        });

        document.getElementById('howToPlayBtn').addEventListener('click', (e) => {
            e.preventDefault();
            alert(`How to Play:
1. Set DC
2. Choose die type
3. Add modifiers
4. Toggle Step Down
5. Select mode
6. Shake or press Harmonize!
7. Use Oraclize (costs 1 Fate Point) to reveal changing lines
8. Fate Points replenish every 24hrs (max 5)`);
            startInactivityTimer();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeFatePoints();
            setupActivityListeners();
            startInactivityTimer();
            document.getElementById('dieType').value = '20';
            document.getElementById('dc').value = '35';
        });
    </script>
</body>
</html>
