<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Chronicles of Auld Ewe</title>
    <link href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #eaeaea; text-align: center; font-size: 0.9rem; }
        nav { background-color: #16213e; }
        h1 { font-size: 1.5rem; margin-bottom: 0.3rem; }
        h2 { font-size: 1.2rem; margin-bottom: 0.3rem; }
        h3 { font-size: 1rem; margin-bottom: 1rem; }
        button { background-color: #0f3460; color: #eaeaea; }
        #result { white-space: pre-wrap; background-color: #16213e; padding: 10px; border-radius: 10px; margin-top: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav class="container-fluid">
        <ul><li><strong>The Chronicles of Auld Ewe</strong></li></ul>
        <ul><li><a href="#" id="howToPlayBtn">How to Play</a></li></ul>
    </nav>
    <main class="container">
        <section>
            <h1>The Chronicles of Auld Ewe</h1>
            <h2>Harmonized Hex & Die System</h2>
            <h3>Cast a Hexagram and Roll your Die to Play</h3>
            <label for="dc">Set Difficulty Class (DC):</label>
            <input type="number" id="dc" placeholder="Enter DC value">
            <label for="dieType">Select Die Type:</label>
            <select id="dieType">
                <option value="6">d6</option>
                <option value="8">d8</option>
                <option value="12">d12</option>
                <option value="20">d20</option>
                <option value="100">d100</option>
            </select>
            <label for="modifier">Apply Modifier (+/-):</label>
            <input type="number" id="modifier" value="0">
            <button onclick="rollDiceAndHexagram()">Harmonize</button>
            <div id="result"></div>
        </section>
    </main>

    <script>
        // Hexagram-related data
        const hexagramNarratives = {
            // ... [Your existing hexagramNarratives object remains the same]
        };

        const hexagramLookup = {
            // ... [Your existing hexagramLookup object remains the same]
        };

        // Corrected Outcome Thresholds for Each Die Type
        const outcomeThresholds = {
            6: { triumph: [6], conflict: [5, 4], disaster: [3, 2, 1] },
            8: { triumph: [8, 7], conflict: [6, 5, 4], disaster: [3, 2, 1] },
            12: { triumph: [12, 11, 10], conflict: [9, 8, 7, 6, 5], disaster: [4, 3, 2, 1] },
            20: { triumph: [20, 19, 18, 17, 16], conflict: [15, 14, 13, 12, 11, 10], disaster: [9, 8, 7, 6, 5, 4, 3, 2, 1] },
            100: {
                triumph: Array.from({ length: 20 }, (_, i) => 100 - i),
                conflict: Array.from({ length: 60 }, (_, i) => 80 - i),
                disaster: Array.from({ length: 20 }, (_, i) => 20 - i)
            }
        };

        // Step-Down Configuration for Die Types
        const stepDownConfig = {
            6: [6, 2],
            8: [6, 4],
            12: [8, 8],
            20: [12, 10],
            100: [20, 20]
        };

        // Get Outcome Based on Die Roll and Die Type
        function getOutcome(dieRoll, dieType) {
            const thresholds = outcomeThresholds[dieType];
            if (!thresholds) return 'Disaster';
            if (thresholds.triumph.includes(dieRoll)) return 'Triumph';
            if (thresholds.conflict.includes(dieRoll)) return 'Conflict';
            return 'Disaster';
        }

        // Apply Step-Down Mechanic
        function applyStepDown(currentDieType) {
            const [reducedDie, hexReduction] = stepDownConfig[currentDieType] || [currentDieType, 0];
            return { newDieType: reducedDie, hexagramReduction: hexReduction };
        }

        // Telegram Integration
        const telegramBotToken = '7510560361:AAH9-j-ryabgvTHo525VQLTx87M-0DXrYso';
        const chatId = '-1002185533073';

        async function sendToTelegram(message) {
            if (!telegramBotToken || !chatId || !message) {
                console.warn('Missing required Telegram parameters');
                return;
            }

            try {
                const url = `https://api.telegram.org/bot${telegramBotToken}/sendMessage`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (!response.ok) {
                    throw new Error(`Telegram API error: ${response.status}`);
                }
                
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Failed to send Telegram message:', error);
            }
        }

        // Roll Dice and Generate Hexagram
        async function rollDiceAndHexagram() {
            const dcValue = parseInt(document.getElementById('dc').value) || 0;
            let dieType = parseInt(document.getElementById('dieType').value);
            const modifier = parseInt(document.getElementById('modifier').value) || 0;

            const stepDown = applyStepDown(dieType);
            dieType = stepDown.newDieType;

            const originalHexagram = Math.floor(Math.random() * 64) + 1;
            const adjustedHexagram = Math.max(1, originalHexagram - stepDown.hexagramReduction);

            const dieRoll = Math.floor(Math.random() * dieType) + 1;
            const outcome = getOutcome(dieRoll, dieType);

            const totalValue = adjustedHexagram + dieRoll + modifier;

            // Get the narrative based on the hexagram and outcome
            const narrativeKey = outcome.toLowerCase();
            const hexagramNarrative = hexagramNarratives[adjustedHexagram][narrativeKey];

            const resultElement = document.getElementById('result');
            resultElement.innerHTML = `
                <strong>Original Hexagram:</strong> ${originalHexagram}<br>
                <strong>Adjusted Hexagram:</strong> ${adjustedHexagram} (Step-down: -${stepDown.hexagramReduction})<br>
                <strong>Die Roll:</strong> ${dieRoll} (d${dieType})<br>
                <strong>Modifier:</strong> ${modifier}<br>
                <strong>Total:</strong> ${totalValue}<br>
                <strong>Outcome:</strong> ${outcome}<br>
                <strong>DC:</strong> ${dcValue}<br>
                <strong>Narrative:</strong> ${hexagramNarrative}
            `;

            if (telegramBotToken && chatId) {
                const telegramMessage = 
                    `🎲 *New Roll Result* 🎲\n` +
                    `✨ *Hexagram*: ${originalHexagram}\n` +
                    `🎲 *Die*: d${dieType} → ${dieRoll}\n` +
                    `📊 *Total*: ${totalValue} (DC: ${dcValue})\n` +
                    `📜 *Outcome*: ${outcome}\n` +
                    `🔮 *Adjusted Hexagram*: ${adjustedHexagram} (-${stepDown.hexagramReduction})\n` +
                    `💫 ${hexagramNarrative ? hexagramNarrative.substring(0, 100) + '...' : ''}`;
                
                await sendToTelegram(telegramMessage);
            }
        }
    </script>
</body>
</html>
