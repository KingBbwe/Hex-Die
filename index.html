        <section>
            <div class="fate-controls">
                <div class="fate-points">
                    <label for="fatePoints">🔮 Fate Points:</label>
                    <input type="number" id="fatePoints" value="3" min="0" max="5" readonly>
                </div>
                <button class="add-fate" onclick="addFatePoint()">Add +1</button>
            </div>

            <h1>The Chronicles of Auld Ewe</h1>
            <h2>Harmonized Hex & Die System</h2>
            <h3>Shake device or click Harmonize!</h3>

            <div id="shakeStatus"></div>

            <div class="input-group">
                <label for="dc">Difficulty Class (DC)</label>
                <input type="number" id="dc" placeholder="Enter DC">
            </div>

            <div class="input-group">
    <label for="dieType">Die Type</label>
    <select id="dieType">
        <option value="6">d6</option>
        <option value="8">d8</option>
        <option value="12">d12</option>
        <option value="20">d20</option>
        <option value="100">d100</option>
    </select>
            </div>

            <div class="input-group">
                <label for="modifier">Modifier (+/-)</label>
                <input type="number" id="modifier" value="0">
            </div>

            <div class="toggle-group">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="stepDownToggle">
                    <label for="stepDownToggle" style="margin: 0;">Step Down</label>
                </div>
            </div>

            <h3 style="margin-bottom: 0.5rem;">Mode</h3>
            <div class="mode-group">
                <button class="mode-button" id="personalMode">Personal</button>
                <button class="mode-button active" id="generalMode">General</button>
                <button class="mode-button" id="actionMode">Action</button>
            </div>

            <button id="enableMotion" onclick="enableShakeDetection()">Enable Shake-to-Roll</button>
            <button onclick="rollDiceAndHexagram()">Harmonize</button>
            <button class="oraclize-btn" onclick="showChangingLines()">Oraclize</button>
            
            <div id="result"></div>
            <div id="changingLines"></div>
        </section>

        49: 'Revolution', 50: 'The Cauldron', 51: 'The Arousing', 52: 'Keeping Still',
        53: 'Development', 54: 'The Marrying Maiden', 55: 'Abundance', 56: 'The Wanderer',
        57: 'The Gentle', 58: 'The Joyous', 59: 'Dispersion', 60: 'Limitation',
        61: 'Inner Truth', 62: 'Small Preponderance', 63: 'After Completion', 64: 'Before Completion'
    };
        
const outcomeThresholds = {
        6: { triumph: [6], conflict: [5,4], disaster: [3,2,1] },
        8: { triumph: [8,7], conflict: [6,5,4], disaster: [3,2,1] },
        12: { triumph: [12,11,10], conflict: [9,8,7,6,5], disaster: [4,3,2,1] },
        20: { triumph: [20,19,18,17,16], conflict: [15,14,13,12,11,10], disaster: [9,8,7,6,5,4,3,2,1] },
        100: { 
            triumph: Array.from({length: 20}, (_, i) => 100 - i),
            conflict: Array.from({length: 60}, (_, i) => 80 - i),
            disaster: Array.from({length: 20}, (_, i) => 20 - i)
        }
    };

    const stepDownConfig = {
        6: [6, 2],
        8: [6, 4],
        12: [8, 8],
        20: [12, 10],
        100: [20, 20]
    };

        // Game State
        let currentHexagramNumber;
        let currentHexagramLines = [];
        let currentChangingLines = [];
        let shakeEnabled = false;
        let lastShake = 0;
        let inactivityTimer;

        // Core Functions
        function initializeFatePoints() {
            const storedData = localStorage.getItem(FATE_STORAGE_KEY);
            const now = Date.now();
            
            if (storedData) {
                const { points, timestamp } = JSON.parse(storedData);
                const hoursSince = (now - timestamp) / (1000 * 60 * 60);
                
                if (hoursSince >= 24) {
                    const newPoints = Math.min(points + BASE_FATE_POINTS, MAX_FATE_POINTS);
                    document.getElementById('fatePoints').value = newPoints;
                    updateFateStorage(newPoints);
                } else {
                    document.getElementById('fatePoints').value = Math.min(points, MAX_FATE_POINTS);
                }
            } else {
                document.getElementById('fatePoints').value = BASE_FATE_POINTS;
                updateFateStorage(BASE_FATE_POINTS);
            }
        }

        function updateFateStorage(points) {
            const storageData = {
                points: points || parseInt(document.getElementById('fatePoints').value),
                timestamp: Date.now()
            };
            localStorage.setItem(FATE_STORAGE_KEY, JSON.stringify(storageData));
        }

        function resetFormFields() {
            document.getElementById('dc').value = '';
            document.getElementById('modifier').value = '0';
            document.getElementById('stepDownToggle').checked = false;
            document.getElementById('changingLines').style.display = 'none';
            document.getElementById('changingLines').innerHTML = '';
        }

        function startInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                resetFormFields();
                document.getElementById('result').innerHTML = '';
            }, INACTIVITY_TIMEOUT);
        }
        
async function sendToTelegram(messageType, data) {
            if (!telegramBotToken || !chatId || telegramBotToken === 'YOUR_TELEGRAM_BOT_TOKEN') return;

            let telegramMessage;
            switch(messageType) {
                case 'fate':
                    telegramMessage = `✨ *Fate Point Added* ✨\nNew total: ${data.points}`;
                    break;
                
                case 'roll':
                    telegramMessage = 
                        `✨ *Hexagram Cast & Roll* ✨\n` +
                        `▫️▫️▫️▫️▫️▫️▫️▫️▫️\n` +
                        `🌌 *Hexagram*: ${data.originalHexagram}\n` +
                        `🎲 *Die*: d${data.dieType} → ${data.dieRoll}\n` +
                        (data.stepDownUsed ? `⚡ *Step Down Applied*: -${data.hexagramReduction}\n` : '') +
                        `📊 *Total*: ${data.total} (DC: ${data.dc})\n` +
                        `📜 *Outcome*: ${data.outcome}\n` +
                        `🔮 ${data.narrative.substring(0, 100)}...\n` +
                        `▫️▫️▫️▫️▫️▫️▫️▫️▫️\n` +
                        `#AuldEwe #FateCast`;
                    break;
            }

            try {
                const response = await fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: telegramMessage,
                        parse_mode: 'Markdown'
                    })
                });

                if (!response.ok) console.error('Telegram API error:', await response.text());
            } catch (error) {
                console.error('Error sending to Telegram:', error);
            }
        }    
        
        function addFatePoint() {
            const current = parseInt(document.getElementById('fatePoints').value);
            if (current < MAX_FATE_POINTS) {
                const newValue = current + 1;
                document.getElementById('fatePoints').value = newValue;
                updateFateStorage(newValue);
                sendToTelegram('fate', { points: newValue });
            }
            startInactivityTimer();
        }

        function generateHexagramLines(hexagramNumber) {
            const binary = hexagramLookup[hexagramNumber];
            return binary.split('').map(b => b === '1' ? 'Solid' : 'Broken');
        }

        function determineChangingLines() {
            return Array.from({length: 6}, (_, i) => 
                Math.random() < 0.25 ? i + 1 : null
            ).filter(Boolean);
        }

        function getActiveNarratives() {
            const activeMode = document.querySelector('.mode-button.active').id;
            return {
                personalMode: personalNarratives,
                generalMode: generalNarratives,
                actionMode: actionNarratives
            }[activeMode];
        }

        function getOutcome(dieRoll, dieType) {
            const thresholds = outcomeThresholds[dieType];
            if (thresholds.triumph.includes(dieRoll)) return 'Triumph';
            if (thresholds.conflict.includes(dieRoll)) return 'Conflict';
            return 'Disaster';
        }

        function showChangingLines() {
            const fatePoints = parseInt(document.getElementById('fatePoints').value);
            if (fatePoints < 1) {
                alert("Not enough Fate Points!");
                return;
            }

            if (confirm("This action costs 1 Fate Point\nProceed?")) {
                document.getElementById('fatePoints').value = fatePoints - 1;
                document.getElementById('changingLines').style.display = 'block';
                document.getElementById('changingLines').innerHTML = `
                    <strong>Changing Lines:</strong> 
                    ${currentChangingLines.length ? currentChangingLines.join(', ') : 'None'}
                `;
                updateFateStorage();
                startInactivityTimer();
            }
        }

        function rollDiceAndHexagram() {
            const originalDie = parseInt(document.getElementById('dieType').value);
            let dieType = originalDie;
            let hexagramReduction = 0;
            const stepDownUsed = document.getElementById('stepDownToggle').checked;

            if (stepDownUsed) {
                const config = stepDownConfig[originalDie];
                if (config) {
                    dieType = config[0];
                    hexagramReduction = config[1];
                }
            }

            currentHexagramNumber = Math.floor(Math.random() * 64) + 1;
            currentHexagramLines = generateHexagramLines(currentHexagramNumber);
            const adjustedHex = Math.max(1, currentHexagramNumber - hexagramReduction);

            const dieRoll = Math.floor(Math.random() * dieType) + 1;
            const outcome = getOutcome(dieRoll, dieType);
            const total = adjustedHex + dieRoll + parseInt(document.getElementById('modifier').value);

            const narratives = getActiveNarratives();
            const narrative = narratives[currentHexagramNumber]?.[outcome.toLowerCase()] || 'No narrative available';

            currentChangingLines = determineChangingLines();

                document.getElementById('result').innerHTML = `
        <strong>Mode:</strong> ${document.querySelector('.mode-button.active').textContent}<br>
        <strong>Original Hexagram:</strong> ${currentHexagramNumber} (${hexagramNames[currentHexagramNumber]})<br>
        <strong>Adjusted Hexagram:</strong> ${adjustedHex} (${hexagramNames[adjustedHex]}) ${hexagramReduction ? `(-${hexagramReduction})` : ''}<br>
        <strong>Die Roll:</strong> d${dieType} → ${dieRoll}<br>
        <strong>Modifier:</strong> ${document.getElementById('modifier').value}<br>
        <strong>Total:</strong> ${total} vs DC ${document.getElementById('dc').value}<br>
        <strong>Outcome:</strong> ${outcome}<br>
        <strong>Narrative:</strong> ${narrative}
    `;

sendToTelegram('roll', {
    originalHexagram: currentHexagramNumber,
    adjustedHexagram: adjustedHex,
    dieType: dieType,
    dieRoll: dieRoll,
    total: total,
    dc: document.getElementById('dc').value,
    outcome: outcome,
    narrative: narrative
});

            startInactivityTimer();
        }

        function enableShakeDetection() {
            if (typeof DeviceMotionEvent !== 'undefined' && 
                typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permission => {
                        if (permission === 'granted') {
                            window.addEventListener('devicemotion', handleShake);
                            shakeEnabled = true;
                            document.getElementById('shakeStatus').textContent = 'Shake detection enabled!';
                        }
                    });
            } else {
                window.addEventListener('devicemotion', handleShake);
                shakeEnabled = true;
                document.getElementById('shakeStatus').textContent = 'Shake to roll!';
            }
        }

        function handleShake(event) {
            const acceleration = event.accelerationIncludingGravity;
            const strength = Math.sqrt(
                acceleration.x ** 2 + 
                acceleration.y ** 2 + 
                acceleration.z ** 2
            );

            if (strength > shakeThreshold && Date.now() - lastShake > shakeCooldown) {
                lastShake = Date.now();
                rollDiceAndHexagram();
            }
        }

        function setupActivityListeners() {
            const inputs = ['dc', 'modifier', 'stepDownToggle', 'dieType'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', startInactivityTimer);
            });

            const buttons = ['enableMotion', 'personalMode', 'generalMode', 'actionMode', 'howToPlayBtn'];
            buttons.forEach(id => {
                document.getElementById(id).addEventListener('click', startInactivityTimer);
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeFatePoints();
            setupActivityListeners();
            startInactivityTimer();
            
            document.querySelectorAll('.mode-button').forEach(button => {
                button.addEventListener('click', function() {
                    document.querySelectorAll('.mode-button').forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            document.getElementById('howToPlayBtn').addEventListener('click', (e) => {
                e.preventDefault();
                alert(`How to Play:
1. Set DC
2. Choose die type
3. Add modifiers
4. Toggle Step Down
5. Select mode
6. Shake or press Harmonize!
7. Use Oraclize (costs 1 Fate Point) to reveal changing lines`);
            });
        });
    </script>
</body>
