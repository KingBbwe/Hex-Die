// Determine outcome based on roll and thresholds
function getOutcome(dieRoll, dieType) {
    const thresholds = outcomeThresholds[dieType];
    if (thresholds.triumph.includes(dieRoll)) return 'Triumph';
    if (thresholds.conflict.includes(dieRoll)) return 'Conflict';
    return 'Disaster';
} 

// Apply step-down mechanic
function applyStepDown(currentDieType) {
    const [reducedDie, hexReduction] = stepDownConfig[currentDieType] || [currentDieType, 0];
    return { newDieType: reducedDie, hexagramReduction: hexReduction };
}

// Shake Detection Permission (For iOS/Chrome)
function enableShakeDetection() {
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        DeviceMotionEvent.requestPermission().then(permissionState => {
            if (permissionState === "granted") {
                window.addEventListener('devicemotion', handleShake);
                document.getElementById("enableMotion").style.display = "none"; // Hide button
            } else {
                alert("Shake detection requires motion access!");
            }
        }).catch(console.error);
    } else {
        window.addEventListener('devicemotion', handleShake);
        document.getElementById("enableMotion").style.display = "none"; // Hide button
    }
}

// Shake Detection Variables
let shakeThreshold = 15;
let shakeDurationMin = 2000;
let shakeDurationMax = 5000;
let shakeStartTime = 0;
let shakeActive = false;

// Shake Detection Function
function handleShake(event) {
    let acceleration = event.accelerationIncludingGravity;
    let shakeStrength = Math.sqrt(acceleration.x ** 2 + acceleration.y ** 2 + acceleration.z ** 2);

    if (shakeStrength > shakeThreshold) {
        let currentTime = Date.now();

        if (!shakeActive) {
            shakeStartTime = currentTime;
            shakeActive = true;
        }

        if (shakeActive && (currentTime - shakeStartTime >= shakeDurationMin) && (currentTime - shakeStartTime <= shakeDurationMax)) {
            shakeActive = false;
            triggerShakeRoll();
        }
    } else {
        shakeActive = false;
    }
}

// Trigger Shake Roll
function triggerShakeRoll() {
    if ("vibrate" in navigator) {
        navigator.vibrate([200, 100, 200]);
    }
    rollDiceAndHexagram();
}

// Dice Roll Logic
function rollDiceAndHexagram() {
    const dcValue = parseInt(document.getElementById('dc').value) || 0;
    let dieType = parseInt(document.getElementById('dieType').value);
    const modifier = parseInt(document.getElementById('modifier').value) || 0;
    const stepDownEnabled = document.getElementById('stepDownToggle').checked;

    let originalHexagram = Math.floor(Math.random() * 64) + 1;
    let adjustedHexagram = originalHexagram;
    let hexagramReduction = 0;

    if (stepDownEnabled) {
        dieType = 6;
        hexagramReduction = 2;
        adjustedHexagram = Math.max(1, originalHexagram - hexagramReduction);
    }

    const dieRoll = Math.floor(Math.random() * dieType) + 1;
    const outcome = ["Triumph", "Conflict", "Disaster"][Math.floor(Math.random() * 3)];
    const totalValue = adjustedHexagram + dieRoll + modifier;

    document.getElementById('result').innerHTML = `
        <strong>Hexagram:</strong> ${originalHexagram}<br>
        <strong>Die Roll:</strong> ${dieRoll} (d${dieType})<br>
        <strong>Total:</strong> ${totalValue} (DC: ${dcValue})<br>
        <strong>Outcome:</strong> ${outcome}
    `;
}
