<body>
<nav class="container-fluid">
<ul><li><strong>The Chronicles of Auld Ewe</strong></li></ul>
<ul><li><a href="#" id="howToPlayBtn">How to Play</a></li></ul>
</nav>
<main class="container">
<section>
<h1>The Chronicles of Auld Ewe</h1>
<h2>Harmonized Hex & Die System</h2>
<h3>Cast a Hexagram and Roll your Die to Play</h3> 

<label for="dc">Set Difficulty Class (DC):</label>
<input type="number" id="dc" placeholder="Enter DC value"> 

<label for="dieType">Select Die Type:</label>
<select id="dieType">
<option value="6">d6</option>
<option value="8">d8</option>
<option value="12">d12</option>
<option value="20">d20</option>
<option value="100">d100</option>
</select> 

<label for="modifier">Apply Modifier (+/-):</label>
<input type="number" id="modifier" value="0"> 

<!-- Step Down Toggle -->
<div class="step-down-container">
    <label for="stepDownToggle">Step Down:</label>
    <input type="checkbox" id="stepDownToggle">
</div> 

<!-- Mode Selection -->
<h3>Mode</h3>
<div class="mode-container">
    <label for="personalModeToggle">Personal</label>
    <input type="checkbox" id="personalModeToggle">
    <label for="actionModeToggle">Action</label>
    <input type="checkbox" id="actionModeToggle">
</div> 

<!-- Add space before Harmonize button -->
<button style="margin-top: 15px;" onclick="rollDiceAndHexagram()">Harmonize</button>
<div id="result"></div>
</section>
</main>

// Outcome Thresholds for Each Die Type
const outcomeThresholds = {
    6: { triumph: [6], conflict: [5, 4], disaster: [3, 2, 1] },
    8: { triumph: [8, 7], conflict: [6, 5, 4], disaster: [3, 2, 1] },

    100: {

        conflict: Array.from({ length: 60 }, (_, i) => 80 - i),
        disaster: Array.from({ length: 20 }, (_, i) => 20 - i)
    }
};

    6: [6, 2],
    8: [6, 4],
    12: [8, 8],
    20: [12, 10],

};

function sendToTelegram(message) {
    const url = `https://api.telegram.org/bot${telegramBotToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
    fetch(url).catch(error => console.log('Telegram message not sent:', error));

// Determine Active Mode
function getActiveNarratives() {
    const personalMode = document.getElementById('personalModeToggle').checked;
    const actionMode = document.getElementById('actionModeToggle').checked; 

    if (personalMode) return personalNarratives;
    if (actionMode) return actionNarratives;
    return generalNarratives; // Default mode
} 

// Get Outcome Based on Die Roll and Die Type
function getOutcome(dieRoll, dieType) {
    const thresholds = outcomeThresholds[dieType];
    if (!thresholds) return 'Disaster';
    if (thresholds.triumph.includes(dieRoll)) return 'Triumph';
    if (thresholds.conflict.includes(dieRoll)) return 'Conflict';
    return 'Disaster';
} 

// Apply Step-Down Mechanic
function applyStepDown(currentDieType) {
    const [reducedDie, hexReduction] = stepDownConfig[currentDieType] || [currentDieType, 0];
    return { newDieType: reducedDie, hexagramReduction: hexReduction };
} 

// Roll Dice and Generate Hexagram
function rollDiceAndHexagram() {
    const dcValue = parseInt(document.getElementById('dc').value) || 0;
    let dieType = parseInt(document.getElementById('dieType').value);
    const modifier = parseInt(document.getElementById('modifier').value) || 0;
    const stepDownEnabled = document.getElementById('stepDownToggle').checked; 

    let originalHexagram = Math.floor(Math.random() * 64) + 1;
    let adjustedHexagram = originalHexagram;
    let hexagramReduction = 0; 

    if (stepDownEnabled) {
        const stepDown = applyStepDown(dieType);
        dieType = stepDown.newDieType;
        hexagramReduction = stepDown.hexagramReduction;
        adjustedHexagram = Math.max(1, originalHexagram - hexagramReduction);
    } 

    const dieRoll = Math.floor(Math.random() * dieType) + 1;
    const outcome = getOutcome(dieRoll, dieType);
    const hexagramData = getActiveNarratives();
    const outcomeMessage = hexagramData[originalHexagram]?.[outcome.toLowerCase()] || 'No narrative available';
    const totalValue = adjustedHexagram + dieRoll + modifier;
    const modeName = document.getElementById('personalModeToggle').checked ? "Personal" : document.getElementById('actionModeToggle').checked ? "Action" : "General"; 

    document.getElementById('result').innerHTML = `
        <strong>Hexagram:</strong> ${originalHexagram}<br>
        <strong>Mode:</strong> ${modeName}<br>
        <strong>Die Roll:</strong> ${dieRoll} (d${dieType})<br>
        <strong>Total:</strong> ${totalValue} (DC: ${dcValue})<br>
        <strong>Outcome:</strong> ${outcome}<br>
        <strong>Narrative:</strong> ${outcomeMessage}
    `; 

    if (telegramBotToken && chatId) {
        const telegramMessage = 
            `🎲 *New Roll Result* 🎲\n` +
            `✨ *Hexagram*: ${originalHexagram}\n` +
            `📜 *Mode*: ${modeName}\n` +
            `🎲 *Die*: d${dieType} → ${dieRoll}\n` +
            `📊 *Total*: ${totalValue} (DC: ${dcValue})\n` +
            `📜 *Outcome*: ${outcome}\n` +
            `🔮 ${outcomeMessage.substring(0, 100)}...`;
        sendToTelegram(telegramMessage);
    }
}
