<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Chronicles of Auld Ewe - Cyberpunk Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
    :root {
        --primary: #6b46c1;
        --primary-hover: #553c9a;
        --bg-dark: #1a1a2e;
        --bg-darker: #16213e;
        --text-light: #e2e8f0;
    }

    body {
        background: linear-gradient(45deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
        color: var(--text-light);
        font-family: 'Orbitron', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.5;
        min-height: 100vh;
    }

    nav {
        background: rgba(22, 33, 62, 0.9) !important;
        backdrop-filter: blur(10px);
        border-bottom: 2px solid var(--primary);
        box-shadow: 0 0 15px rgba(107, 70, 193, 0.3);
        padding: 1rem;
        margin-bottom: 2rem;
    }

    nav ul {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0;
        margin: 0;
        list-style: none;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
        background: rgba(26, 26, 46, 0.9);
        border: 1px solid var(--primary);
        box-shadow: 0 0 30px rgba(107, 70, 193, 0.2);
        border-radius: 8px;
        backdrop-filter: blur(5px);
    }

    h1, h2, h3 {
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(107, 70, 193, 0.5);
    }

    h1 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        color: #fff;
        text-align: center;
    }

    h2 {
        font-size: 1.2rem;
        margin-bottom: 0.3rem;
        color: #cbd5e1;
        text-align: center;
    }

    h3 {
        font-size: 1rem;
        margin-bottom: 1.5rem;
        color: #94a3b8;
        text-align: center;
    }

    .input-group {
        margin-bottom: 1.5rem;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-light);
    }

    input, select {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid var(--primary) !important;
        border-radius: 0.375rem;
        background: rgba(22, 33, 62, 0.8) !important;
        color: var(--text-light) !important;
        margin-bottom: 0.5rem;
        transition: all 0.3s ease !important;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #21bf73 !important;
        box-shadow: 0 0 15px rgba(107, 70, 193, 0.4) !important;
    }

    .toggle-group {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
        padding: 0.75rem;
        background-color: var(--bg-darker);
        border: 1px solid var(--primary);
        border-radius: 0.375rem;
        box-shadow: inset 0 0 10px rgba(107, 70, 193, 0.2);
    }

    .mode-group {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
    }

    .mode-button {
        flex: 1;
        padding: 0.6rem;
        border: 2px solid var(--primary) !important;
        border-radius: 0.375rem;
        background-color: transparent;
        color: var(--text-light);
        cursor: pointer;
        transition: all 0.2s;
        clip-path: polygon(90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%, 10% 0);
    }

    .mode-button.active {
        background-color: var(--primary);
        border-color: var(--primary);
    }

    .mode-button:hover {
        background-color: var(--primary-hover);
    }

    button {
        width: 100%;
        padding: 0.8rem;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        margin-bottom: 0.5rem;
        position: relative;
        overflow: hidden;
        border: 2px solid var(--primary) !important;
        clip-path: polygon(95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%, 5% 0);
    }

    button:hover {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(107, 70, 193, 0.4);
    }

    button::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(107, 70, 193, 0.2), transparent);
        transform: rotate(45deg);
        transition: all 0.5s;
    }

    button:hover::before {
        animation: cyber-glow 1.5s infinite;
    }

    .oraclize-btn {
        background-color: #21bf73;
    }

    #result {
        margin-top: 1.5rem;
        padding: 1rem;
        background: rgba(22, 33, 62, 0.8);
        border-radius: 0.375rem;
        border: 1px solid var(--primary);
        box-shadow: inset 0 0 20px rgba(107, 70, 193, 0.1),
                    0 0 20px rgba(107, 70, 193, 0.1);
        position: relative;
    }

    #result strong {
        color: #a78bfa;
    }

    #changingLines {
        text-align: left;
        margin-top: 1rem;
        padding: 1rem;
        background: rgba(22, 33, 62, 0.8);
        border-radius: 0.375rem;
        display: none;
        border: 1px solid var(--primary);
        box-shadow: inset 0 0 20px rgba(107, 70, 193, 0.1);
    }

    .fate-controls {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1rem;
    }

    .fate-points {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    #fatePoints {
        width: 60px;
        font-weight: bold;
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        border: 2px solid var(--primary) !important;
        background: rgba(22, 33, 62, 0.9) !important;
    }

    .add-fate {
        background-color: #21bf73 !important;
        width: auto !important;
        padding: 0.5rem 1rem !important;
    }

    .chat-manager-container {
        margin-top: 2rem;
        padding: 1rem;
        border-top: 1px solid var(--primary);
        background-color: var(--bg-darker);
        border-radius: 0.375rem;
        border: 1px solid var(--primary);
        box-shadow: inset 0 0 20px rgba(107, 70, 193, 0.1);
    }

    .chat-manager-details {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
    }

    .chat-manager-details summary {
        font-size: 1.1rem;
        font-weight: bold;
        color: var(--primary);
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 0.375rem;
        background-color: var(--bg-dark);
        transition: background-color 0.2s;
        border: 1px solid var(--primary);
        clip-path: polygon(95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%, 5% 0);
    }

    .chat-manager-details summary:hover {
        background-color: var(--primary-hover);
        color: white;
    }

    .chat-setup-form,
    .player-setup-form {
        margin: 1rem 0;
        padding: 1rem;
        background-color: var(--bg-dark);
        border-radius: 0.375rem;
        border: 1px solid var(--primary);
    }

    #gmCodeDisplay {
        margin-top: 1rem;
        padding: 1rem;
        background-color: var(--bg-dark);
        border: 1px solid var(--primary);
        border-radius: 0.375rem;
        text-align: center;
    }

    @keyframes cyber-glow {
        0% { left: -50%; }
        100% { left: 150%; }
    }

    @keyframes border-pulse {
        0% { opacity: 0.5; }
        50% { opacity: 1; }
        100% { opacity: 0.5; }
    }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><strong style="color: #fff;">The Chronicles of Auld Ewe</strong></li>
            <li><a href="#" id="howToPlayBtn" style="color: var(--text-light);">How to Play</a></li>
        </ul>
    </nav>

    <main class="container">
        <section>
            <div class="fate-controls">
                <div class="fate-points">
                    <label for="fatePoints">Fate Points:</label>
                    <input type="number" id="fatePoints" value="3" min="0" max="5" readonly>
                </div>
                <button class="add-fate" onclick="addFatePoint()">Add +1</button>
            </div>

            <h1>The Chronicles of Auld Ewe</h1>
            <h2>Harmonized Hex & Die System</h2>
            <h3>Shake device or click Harmonize!</h3>

            <div id="shakeStatus"></div>

            <div class="input-group">
                <label for="dc">Difficulty Class (DC)</label>
                <input type="number" id="dc" placeholder="Enter DC">
            </div>

            <div class="input-group">
                <label for="dieType">Die Type</label>
                <select id="dieType">
                    <option value="6">d6</option>
                    <option value="8">d8</option>
                    <option value="12">d12</option>
                    <option value="20">d20</option>
                    <option value="100">d100</option>
                </select>
            </div>

            <div class="input-group">
                <label for="modifier">Modifier (+/-)</label>
                <input type="number" id="modifier" value="0">
            </div>

            <div class="toggle-group">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="stepDownToggle">
                    <label for="stepDownToggle" style="margin: 0;">Step Down</label>
                </div>
            </div>

            <h3 style="margin-bottom: 0.5rem;">Mode</h3>
            <div class="mode-group">
                <button class="mode-button" id="personalMode">Personal</button>
                <button class="mode-button active" id="generalMode">General</button>
                <button class="mode-button" id="actionMode">Action</button>
            </div>

            <button id="enableMotion" onclick="enableShakeDetection()">Enable Shake-to-Roll</button>
            <button onclick="rollDiceAndHexagram()">Harmonize</button>
            <button class="oraclize-btn" onclick="showChangingLines()">Oraclize</button>

            <div id="result"></div>
            <div id="changingLines"></div>

            <div id="chatManager" class="chat-manager-container">
                <details class="chat-manager-details">
                    <summary>Game Master Settings</summary>
                    <div class="chat-setup-form">
                        <h3>Set Up New Game Group</h3>
                        <div class="input-group">
                            <label for="groupName">Group Name:</label>
                            <input type="text" id="groupName" placeholder="Enter your group name">
                        </div>
                        <div class="input-group">
                            <label for="chatId">Telegram Chat ID:</label>
                            <input type="text" id="chatId" placeholder="Enter your Telegram chat ID">
                            <button onclick="showChatIdInstructions()">How to get Chat ID?</button>
                        </div>
                        <button onclick="setupNewGameGroup()">Create Game Group</button>

                        <div id="gmCodeDisplay" style="display: none;">
                            <h4>Your GM Code:</h4>
                            <p id="gmCodeText"></p>
                            <p class="instructions">Share this code with your players to connect them to your group.</p>
                        </div>
                    </div>

                    <div class="player-setup-form">
                        <h3>Player Settings</h3>
                        <div class="input-group">
                            <label for="gmCode">GM Code:</label>
                            <input type="text" id="gmCode" placeholder="Enter your GM's code">
                        </div>
                        <div class="input-group">
                            <label for="playerName">Your Name:</label>
                            <input type="text" id="playerName" placeholder="Enter your name">
                        </div>
                        <button onclick="joinGameGroup()">Join Game Group</button>
                    </div>
                </details>
            </div>
        </section>
    </main>
